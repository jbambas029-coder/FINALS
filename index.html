<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<style>
@media (max-width: 480px) {
  Body{
    overflow-y: auto;
  }
  #nav h2{
    position: relative;
    left: 50px;
  }
  #nav ul{
    position: relative;
    left: 220px;
    top: 60px;
  }
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-color: #222D11;
    font-family: Poppins, sans-serif;
    overflow: hidden;
}

/* Navigation */
#nav {
    background:#222D11;
    height: 80px;
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
}
#nav h2{
    font-family: "Tangerine", cursive;
    font-weight: 700;
    color: #fff;
    line-height: 80px;
    margin: 0;
    font-size: 2.5rem;
    margin-left: 100px;
}
#nav ul{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    height: 80px;
    align-items: center;
    float: right;
    margin-right: 100px;
    margin-top: -80px;
    font-size: 1.1rem;
    gap: 40px;
}

#nav ul li:hover{
    transform: scale(1.2);
}
#nav ul li a{
    color: #F1F986;
    text-decoration: none;
    transition: 0.3s;
}
#nav ul li a#active{
    border-bottom: 2px solid #fff;
    padding-bottom: 4px;
    color: #fff;
}
#nav ul li a:hover{
    color: #fff;
}

.me img{
    height: 40%;
    position: relative;
    left: 8%;
     animation: slideIn 0.7s ease-out forwards;
}

#circle{
    height: 400px;
    width: 400px;
    border-radius: 100%;
    background-color: #F1F986;
    position: absolute;
    top: 15%;
    left: 14%;
         animation: slideIn 0.7s ease-out forwards;
}

.contac h1{
    position: absolute;
    top:8%;
    left: 47%;
    color: #F1F986;
    font-family: 'Times New Roman', Times, serif;
    font-size: 4rem;
    font-style: italic;
         animation: slideIn 0.7s ease-out forwards;
}

.contac p{
     position: absolute;
    top: 23.4%;
    left: 50%;
    color: #F1F986;
    font-family: 'Times New Roman', Times, serif;
    font-size: 1.3rem;
    margin-right: 150px;
         animation: slideIn 0.7s ease-out forwards;
}

.socials {
    position: absolute;
    top: 90%;
    left: 37%;
    text-align: center;
    color: #F1F986;
    font-family: 'Times New Roman', serif;
     animation: slideIn 0.7s ease-out forwards;
}

.social-icons a {
    color: #F1F986;
    font-size: 2rem;
    margin: 0 15px;
    transition: 0.3s;
}

.social-icons a:hover {
    color: #222D11;
    background-color: #F1F986;
    padding: 8px;
    border-radius: 50%;
    transform: scale(1.2);
}

.contact-form {
    position: absolute;
    top: -880%;
    left: 120%;
    width: 400px;
    height: 300px;
    background: rgba(241, 249, 134, 0.1);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(241, 249, 134, 0.4);
    font-family: Poppins, sans-serif;
    color: #F1F986;
}

.contact-form input,
.contact-form textarea {
    width: 90%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border: 2px solid #F1F986;
    border-radius: 10px;
    background: rgba(34, 45, 17, 0.7);
    color: #F1F986;
    font-size: 1rem;
    font-family: Poppins, sans-serif;
    outline: none;
    transition: 0.3s;
}
.contact-form textarea{
    height: 70px;
}
.contact-form input:focus,
.contact-form textarea:focus {
    border-color: #fff;
    box-shadow: 0 0 8px #F1F986;
}

.contact-form button {
    width: 100%;
    padding: 12px;
    background-color: #F1F986;
    color: #222D11;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    transition: 0.3s;
}

.contact-form button:hover {
    background-color: #fff;
    color: #222D11;
    box-shadow: 0 0 15px #F1F986;
    transform: scale(1.05);
}

.modal {
    background: #F1F986;
    color: #222D11;
    padding: 25px 30px;
    width: 300px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    animation: fadeIn 0.3s ease-in-out;
}

.close-btn {
    margin-top: 15px;
    padding: 8px 15px;
    background: #222D11;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}
.close-btn:hover {
    transform: scale(1.05);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}
    </style>
</head>
<body>
    <div id="nav">
    <h2>Aesthetically Jayb</h2>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="Contact.html"id="active">Contact</a></li>
        <li><a href="Skills.html">Skills</a></li>
        <li><a href="Portfolio.html">Portfolio</a></li>
        <li><a href="About.html">About Me</a></li>
    </ul>
    </div>

    <div id="circle"></div>

    <div class="me">
    <img src="Images/10.png" alt="">
    </div>

    <div class="contac">
        <h1>Get In Touch</h1>
        <p>Let’s create something amazing together! Feel free to reach out for design projects, collaborations, or just to say hi.</p>
    </div>

        <div class="socials">
    <div class="social-icons">
        <a href="https://www.facebook.com/yourprofile" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/yourprofile" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="mailto:youremail@example.com"><i class="fas fa-envelope"></i></a>
    </div>


    <div class="contact-form">
  <form action="mailto:jgambas@ccc.edu.ph" method="post" enctype="text/plain">
    <input type="text" name="name" placeholder="Your Name" required><br>
    <input type="email" name="email" placeholder="Your Email" required><br>
    <textarea name="message" placeholder="Your Message" rows="5" required></textarea><br>
    <button type="submit">Send Message</button>
  </form>
</div>
</div>
<div id="thankYouModal" class="modal-bg">
  <div class="modal">
    <h2>Thank You!</h2>
    <p>Your message has been sent successfully.</p>
    <button class="close-btn">Close</button>
  </div>
</div>
<script>
const form = document.querySelector('form');
const modalBg = document.getElementById('thankYouModal');
const closeBtn = document.querySelector('.close-btn');

form.addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent default mailto behavior
    modalBg.style.display = 'flex';
    // Optional: Reset form
    form.reset();
});

closeBtn.addEventListener('click', () => {
    modalBg.style.display = 'none';
});

window.addEventListener('click', function(e) {
    if (e.target === modalBg) {
        modalBg.style.display = 'none';
    }
});
</script>

</body>
</html>
